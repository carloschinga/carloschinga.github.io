<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Reloj Marcador de Asistencia</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: #f8f9fa;
                margin: 0;
                padding: 20px;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .container {
                background: #ffffff;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 400px;
                text-align: center;
            }
            h1 {
                margin-bottom: 20px;
                color: #333;
            }
            label {
                font-weight: bold;
                margin-bottom: 5px;
                display: block;
                text-align: left;
                color: #555;
            }
            input[type="text"],
            select {
                width: 100%;
                padding: 10px;
                margin-bottom: 15px;
                border: 1px solid #ced4da;
                border-radius: 4px;
                font-size: 16px;
            }
            button {
                width: 100%;
                padding: 10px;
                background: #007bff;
                border: none;
                color: #fff;
                font-size: 16px;
                border-radius: 4px;
                cursor: pointer;
                transition: background 0.3s ease;
            }
            button:hover {
                background: #0056b3;
            }
            #resultado {
                margin-top: 15px;
                font-weight: bold;
                color: #333;
            }
            #reloj {
                font-size: 16px;
                margin-top: 20px;
                font-family: monospace;
                color: #2d8b59;
            }
            .btn-success {
                background-color: #39b674;
                border: none;
                border-radius: 8px;
                padding: 10px;
                font-size: 16px;
                width: 100%;
                transition: 0.3s;
            }

            .btn-success:hover {
                background-color: #2e8f5c;
            }
            .btn-info {
                background-color: #1d3c6a; /* Azul similar al del botón */
                border: none;
                border-radius: 4px;
                padding: 10px;
                font-size: 16px;
                width: 100%;
                transition: 0.3s;
            }

            .btn-info:hover {
                background-color: #0e2b48; /* Azul más oscuro para el hover */
            }
            /* Contenedor para los botones "Marcar Asistencia" y "Ver Asistencias" */
            .button-group {
                display: flex;
                justify-content: space-between; /* Distribuye los botones a los extremos */
                margin-top: 20px;
            }

            /* Estilo de los botones */
            .button-group .btn {
                width: 48%; /* Ajusta el tamaño de los botones para que no se desborden */
                padding: 10px;
                font-size: 16px;
            }

            .button-group .btn:hover {
                opacity: 0.9; /* Efecto hover para los botones */
            }
            /* Estilo de los botones */
            .button-group .btn {
                width: 48%; /* Ajusta el tamaño de los botones para que no se desborden */
                padding: 10px;
                font-size: 16px;
                border-radius: 8px; /* Aplica el border-radius a ambos botones */
            }
        </style>
    </head>
    <body>
        <div class="container">
            <small class="text-sm-center" id="reloj"></small>
            <h1>Marcador de Asistencia</h1>
            <div>
                <label for="tipoDocCombo">Tipo de Documento:</label>
                <select id="tipoDocCombo" name="tipoDocCombo">
                    <option value="">Selecciona un tipo de documento</option>
                    <!-- Las opciones se cargarán aquí desde el servidor -->
                </select>
            </div>
            <div>
                <label for="numeDocu">Número de Documento:</label>
                <input
                    type="text"
                    id="numeDocu"
                    name="numeDocu"
                    placeholder="Ingresa tu número de documento"
                    />
            </div>
            <div class="button-group">
                <button
                    class="btn btn-info"
                    onclick="verAsistencias()"
                    id="verAsistenciasBtn"
                    >
                    Ver Asistencias
                </button>
                <button class="btn btn-success" id="registrarBtn">
                    Marcar Asistencia
                </button>
            </div>
            <div id="resultado"></div>
            <div id="resulError" style="color: #ff0000"></div>
            <!-- Reloj digital que muestra la hora del servidor -->
        </div>
        <div class="container2">
            <h1>Marcador de Asistencia</h1>
            <div>¡Esta PC no esta habilitada para marcar asistencia!</div>
        </div>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/es.min.js"></script>
<script>
    let endpoint="http://181.224.248.20/GestorFarmacia/";
    document.addEventListener("DOMContentLoaded", function () {
    document.querySelector(".container").style.display = "none";
    document.querySelector(".container2").style.display = "none";

    if (!document.cookie.includes("habilitado")) {
        document.querySelector(".container2").style.display = "block";
    } else {
        document.querySelector(".container").style.display = "block";
    }

    async function cargarTiposDoc() {
        try {
            const response = await fetch(endpoint+"tipodocumentoservlet");
            const data = await response.json();
            const combo = document.getElementById("tipoDocCombo");
            combo.innerHTML = "";
            data.forEach(nombre => {
                const option = document.createElement("option");
                option.value = nombre.codiTipoDoc;
                option.textContent = nombre.nombTipoDoc;
                combo.appendChild(option);
            });
        } catch (error) {
            alert("Error al cargar los nombres.");
        }
    }

    document.getElementById("registrarBtn").addEventListener("click", registrarAsistencia);

    async function registrarAsistencia() {
        const tipoDocu = document.getElementById("tipoDocCombo").value;
        const numeDocu = document.getElementById("numeDocu").value.trim();

        if (!numeDocu || !tipoDocu) {
            document.getElementById("resultado").innerHTML = '<p style="color:#FF0000">Por favor, ingresa un número de documento y selecciona el tipo de documento</p>';
            setTimeout(() => document.getElementById("resultado").textContent = "", 3000);
            return;
        }

        try {
            const response = await fetch(endpoint+"marcacion", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ numeDocu, codiTipoDoc: tipoDocu })
            });
            const result = await response.json();

            if (result.status === "success") {
                const mensaje = result.marcacion === "entrada"
                    ? `${result.nombre} ha registrado su entrada el día ${result.hora}`
                    : `${result.nombre} ha registrado su salida el día ${result.hora}`;
                document.getElementById("resultado").textContent = mensaje;
            } else {
                document.getElementById("resulError").textContent = `ERROR: ${result.message}`;
            }

            setTimeout(() => document.getElementById("resultado").textContent = "", 3000);
            document.getElementById("numeDocu").value = "";
        } catch (error) {
            document.getElementById("resulError").textContent = "Error en la conexión";
        }
    }

    async function verAsistencias() {
        const numeDocu = document.getElementById("numeDocu").value.trim();
        const tipoDocu = document.getElementById("tipoDocCombo").value.trim();

        if (!numeDocu || !tipoDocu) {
            document.getElementById("resultado").innerHTML = '<p style="color:#FF0000">Por favor, ingresa un número de documento y selecciona el tipo de documento</p>';
            setTimeout(() => document.getElementById("resultado").textContent = "", 3000);
            return;
        }

        try {
            const response = await fetch(endpoint+`verAsistencias?numeDocu=${encodeURIComponent(numeDocu)}&codiTipoDoc=${encodeURIComponent(tipoDocu)}`);
            const data = await response.json();

            if (data.status === "success") {
                let resultadoHTML = "<h3>Asistencias de Hoy</h3>";
                if (data.asistencias.length > 0) {
                    resultadoHTML += `<table border="1" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr><th>Fecha</th><th>Entrada</th><th>Salida</th></tr>
                        </thead>
                        <tbody>`;
                    data.asistencias.forEach(asistencia => {
                        resultadoHTML += `<tr><td>${asistencia.fecha}</td><td>${asistencia.entrada}</td><td>${asistencia.salida}</td></tr>`;
                    });
                    resultadoHTML += "</tbody></table>";
                } else {
                    resultadoHTML += "<p>No se encontraron asistencias para hoy.</p>";
                }
                document.getElementById("resultado").innerHTML = resultadoHTML;
                setTimeout(() => document.getElementById("resultado").innerHTML = "", 3000);
                document.getElementById("numeDocu").value = "";
            } else {
                document.getElementById("resulError").textContent = data.message || "Error desconocido al obtener las asistencias.";
            }
        } catch (error) {
            document.getElementById("resultado").textContent = "Error al realizar la solicitud.";
        }
    }

    async function obtenerFechaHora() {
        try {
            const response = await fetch(endpoint+"getdatetime");
            const data = await response.json();
            updateDateTime(data.datetime);
        } catch (error) {
            document.getElementById("datetime").textContent = "Error al cargar la fecha y hora";
        }
    }

    function updateDateTime(initialDateTime) {
        let dateTime = new Date(initialDateTime.replace(" ", "T"));

        if (isNaN(dateTime.getTime())) {
            document.getElementById("reloj").textContent = "Error: Fecha y hora no válidas";
            return;
        }

        function mostrarFechaHora() {
            const formattedDateTime = dateTime.toLocaleString("es-ES", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
            document.getElementById("reloj").textContent = formattedDateTime;
        }

        mostrarFechaHora();
        setInterval(() => {
            dateTime.setSeconds(dateTime.getSeconds() + 1);
            mostrarFechaHora();
        }, 1000);
    }

    cargarTiposDoc();
    document.getElementById("verAsistenciasBtn").addEventListener("click", verAsistencias);
    obtenerFechaHora();
});
    </script>
</html>
